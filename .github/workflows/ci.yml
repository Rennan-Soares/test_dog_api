name: API Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Permissões nativas para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que execuções consecutivas não entrem em conflito
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests
      run: mvn test
      continue-on-error: true # Garante a geração do relatório mesmo se um teste falhar

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: target/allure-results
        gh_pages: .allure-env # Pasta temporária interna
        allure_report: allure-report
        allure_history: allure-history

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      if: always()
      with:
        path: 'allure-history/allure-report' # Sobe a pasta do relatório direto para o Pages

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4